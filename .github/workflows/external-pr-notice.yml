name: External pull request notice

# Uses pull_request_target so the token has write access to comment on PRs from
# forks. We never check out the PR's code, so running in the base repo context is safe.
on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  notice:
    if: ${{ !contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association) }}
    runs-on: ubuntu-latest
    steps:
      - name: Comment if no issue is linked
        uses: actions/github-script@v7
        with:
          script: |
            const prBody = context.payload.pull_request.body ?? '';
            if (/#\d+|\/issues\/\d+/.test(prBody)) return;

            const body = [
              `Thanks for the PR, @${context.payload.pull_request.user.login}!`,
              ``,
              `Pull requests are only accepted when they originate from an issue labeled`,
              `\`pr-welcome\`. This PR doesn't reference an issue, so it will likely be closed.`,
              `Please [open an issue](https://github.com/${context.repo.owner}/${context.repo.repo}/issues)`,
              `first (or find an existing one), wait for the \`pr-welcome\` label, then link`,
              `it in the PR description, e.g.`,
              `\`Fixes #123\`. See`,
              `[CONTRIBUTING.md](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/CONTRIBUTING.md)`,
              `for details.`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
