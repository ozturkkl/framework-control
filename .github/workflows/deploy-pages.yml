name: Deploy web UI and package repos to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "packaging/deb-rpm/build-package-repos.sh"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          VITE_API_BASE: ${{ secrets.VITE_API_BASE || vars.VITE_API_BASE }}
      - name: Install package repo tools
        run: sudo apt-get update && sudo apt-get install -y apt-utils createrepo-c
      - name: Build package repos
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_SIGNING_KEY: ${{ secrets.PACKAGE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          gpg --batch --import <<< "$PACKAGE_SIGNING_KEY"
          packaging/deb-rpm/build-package-repos.sh web/dist/packages \
            "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/packages"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
